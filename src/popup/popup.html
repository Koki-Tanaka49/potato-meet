<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potato Meet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <p>Google Meet用</p>
        <h1>Potato Meet</h1>
      </header>

      <section class="preview-section" aria-labelledby="preview-title">
        <h2 id="preview-title">プレビュー</h2>
        <div id="selection-preview" class="camera-preview" role="img" aria-label="じゃがいも">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="camera-character" aria-hidden="true">
            <img id="preview-body" class="preview-body" src="../potato/potato-body.png" alt="" />
            <img id="preview-sunglasses" class="preview-sunglasses" src="../potato/sunglasses.png" alt="" hidden />
            <img class="preview-mouth" src="../potato/mouth-open.png" alt="" />
          </span>
        </div>
        <p id="selection-summary" class="sr-only">じゃがいも</p>
      </section>

      <fieldset class="variants">
        <legend>ポテトを選ぶ</legend>
        <div class="variant-list">
          <label class="variant-option">
            <input type="radio" name="potato-variant" value="classic" checked />
            <span class="variant-content">
              <span class="variant-preview"><img src="../potato/potato-body.png" alt="" /></span>
              <span>じゃがいも</span>
            </span>
          </label>
          <label class="variant-option">
            <input type="radio" name="potato-variant" value="sweet" />
            <span class="variant-content">
              <span class="variant-preview"><img src="../potato/potato-body-sweet.png" alt="" /></span>
              <span>さつまいも</span>
            </span>
          </label>
          <label class="variant-option">
            <input type="radio" name="potato-variant" value="purple" />
            <span class="variant-content">
              <span class="variant-preview"><img src="../potato/potato-body-purple.png" alt="" /></span>
              <span>紫いも</span>
            </span>
          </label>
        </div>
      </fieldset>

      <div class="settings-panel">
        <section class="setting-row" aria-labelledby="toggle-label">
          <span class="setting-icon potato-icon" aria-hidden="true"></span>
          <div class="setting-copy">
            <strong id="toggle-label">ポテト表示</strong>
            <span id="state-label">オフ</span>
          </div>
          <label class="switch">
            <input id="potato-toggle" type="checkbox" role="switch" aria-labelledby="toggle-label state-label" />
            <span class="track"><span class="thumb"></span></span>
          </label>
        </section>

        <section class="setting-row" aria-labelledby="sunglasses-label">
          <span class="setting-icon accessory-preview" aria-hidden="true">
            <img src="../potato/sunglasses.png" alt="" />
          </span>
          <div class="setting-copy">
            <strong id="sunglasses-label">サングラス</strong>
            <span id="sunglasses-state">オフ</span>
          </div>
          <label class="switch">
            <input id="sunglasses-toggle" type="checkbox" role="switch" aria-labelledby="sunglasses-label sunglasses-state" />
            <span class="track"><span class="thumb"></span></span>
          </label>
        </section>
      </div>

      <p id="connection-notice" class="connection-notice" role="status" hidden>
        Meetタブを再読み込みしてください
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
